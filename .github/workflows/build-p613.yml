name: Build SM-P613 (gta4xlvewifi) Kernel (android18-7.3)

on:
  workflow_dispatch:
  push:
    branches: [ "android18-7.3", "android18-7.3-caf", "p613/**" ]

concurrency:
  group: p613-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 Kernel & DTB (SM-P613)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache clang cpio device-tree-compiler \
            dwarves flex kmod libelf-dev libssl-dev lld llvm python3 rsync zip

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-p613-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-p613-ccache-

      - name: Setup Official KernelSU (tiann/KernelSU main @ 2a60b289)
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/tiann/KernelSU.git KernelSU
          git -C KernelSU checkout 2a60b289
          # Fix Linux 6.13+/7.3 out-of-tree (O=out) Kbuild where $(src) already includes $(srctree) ("../drivers/kernelsu")
          sed -i 's|KSU_KERNEL_DIR := \$(srctree)/\$(src)|KSU_KERNEL_DIR := $(patsubst %/,%,$(dir $(abspath $(lastword $(MAKEFILE_LIST)))))|' KernelSU/kernel/Kbuild
          grep -q 'KSU_KERNEL_DIR := \$(patsubst' KernelSU/kernel/Kbuild
          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Configure Kernel (defconfig + sm7125.config + p613.config)
        run: |
          mkdir -p out
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/sm7125.config \
            arch/arm64/configs/p613.config
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          cp out/.config out/p613_effective.config
          # Fail fast if critical Android / P613 / KernelSU options were silently dropped by Kconfig
          missing=0
          for opt in \
            'CONFIG_SECURITY_SELINUX=y' \
            'CONFIG_SECURITY_SELINUX_DEVELOP=y' \
            'CONFIG_ANDROID_BINDERFS=y' \
            'CONFIG_USB_CONFIGFS_F_FS=y' \
            'CONFIG_PSTORE_RAM=y' \
            'CONFIG_DRM_SIMPLEDRM=y' \
            'CONFIG_REGULATOR_QCOM_REFGEN=y' \
            'CONFIG_TOUCHSCREEN_HIMAX_HX83102_SPI=y' \
            'CONFIG_BOOT_CONFIG_EMBED=y' \
            'CONFIG_ZRAM=y' \
            'CONFIG_XFRM_USER=y' \
            'CONFIG_DEBUG_INFO_BTF=y' \
            'CONFIG_HW_RANDOM_QCOM=y' \
            'CONFIG_RTC_DRV_PM8XXX=y' \
            'CONFIG_FW_LOADER_USER_HELPER=y' \
            'CONFIG_KPROBES=y' \
            'CONFIG_HEADERS_INSTALL=y' \
            'CONFIG_KSU=y' \
            'CONFIG_QCOM_SYSMON=y' \
            'CONFIG_QCOM_Q6V5_PAS=y' \
            'CONFIG_ATH10K_SNOC=y' \
            'CONFIG_BT_QCA=y' \
            'CONFIG_SND_SOC_SM8250=y' \
            'CONFIG_SND_SOC_TAS2562=y' \
            'CONFIG_SND_SOC_WCD938X_SDW=y' \
            'CONFIG_QCOM_KGSL=y' \
            'CONFIG_QCOM_KGSL_UPSTREAM=y' \
            'CONFIG_SPECTRA_CAMERA=y'; do
            if ! grep -qx "$opt" out/.config; then
              echo "MISSING REQUIRED CONFIG: $opt (actual: $(grep -E "^(# )?${opt%%=*}[= ]" out/.config || echo unset))"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          grep -qE '^CONFIG_LSM=".*selinux.*"' out/.config || { echo "SELinux missing from CONFIG_LSM!"; exit 1; }
          # Pre-install UAPI headers so KernelSU's Kbuild sees $(objtree)/usr/include/linux/unistd.h for preinit/runner.elf
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 headers

      - name: Fast Check (P613 DTB, KernelSU & SM7125/P613 Drivers)
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache --max-size=2G
          # Generate out/security/selinux/{flask.h,av_permissions.h} before compiling drivers/kernelsu/
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" -j$(nproc) \
            security/selinux/avc.o 2>&1 | tee fastcheck.log
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 DTC_FLAGS="-@" CC="ccache clang" -j$(nproc) \
            qcom/sm7125-samsung-gta4xlvewifi.dtb \
            drivers/kernelsu/ \
            drivers/gpu/msm/ \
            drivers/media/platform/qcom/camx/ \
            drivers/gpu/drm/msm/msm_drv.o \
            drivers/firmware/qcom/qcom_tzmem.o \
            drivers/soc/qcom/qcom_pd_mapper.o \
            drivers/gpu/drm/panel/panel-himax-hx83102.o \
            drivers/input/touchscreen/himax_hx83102_spi.o \
            drivers/regulator/isl98608-regulator.o \
            drivers/power/supply/sm5714-charger.o \
            drivers/power/supply/sm5714-fg.o \
            sound/soc/qcom/sm8250.o 2>&1 | tee -a fastcheck.log

      - name: Build Image.gz, SM-P613 DTB, and Modules
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.cache/ccache"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 DTC_FLAGS="-@" CC="ccache clang" -j$(nproc) \
            Image.gz \
            qcom/sm7125-samsung-gta4xlvewifi.dtb \
            modules 2>&1 | tee build.log
          ccache -s

      - name: Stage Artifacts & AnyKernel3 ZIP
        run: |
          mkdir -p dist
          cp out/arch/arm64/boot/Image.gz dist/Image.gz
          cp out/arch/arm64/boot/dts/qcom/sm7125-samsung-gta4xlvewifi.dtb dist/sm7125-samsung-gta4xlvewifi.dtb
          cp out/p613_effective.config dist/p613_effective.config

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            INSTALL_MOD_PATH="$PWD/out/modules_install" \
            INSTALL_MOD_STRIP=1 \
            modules_install
          tar -czf dist/modules.tar.gz -C out/modules_install .

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          rm -rf .git* README.md
          cp ../dist/Image.gz ./Image.gz
          cp ../dist/sm7125-samsung-gta4xlvewifi.dtb ./dtb
          cat > anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=SM-P613 Mainline android18-7.3
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          boot_img_hdr_ver=2;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF
          chmod +x anykernel.sh
          zip -r9 ../dist/p613-android18-7.3-$(date +%Y%m%d).zip .

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p613-android18-7.3-build
          path: dist/

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p613-build-log
          path: |
            fastcheck.log
            build.log
          if-no-files-found: ignore
